[program:slurmd]
environment=NOTIFY_SOCKET="/tmp/fakesystemd.sock"
command=bash -xc "exec /usr/sbin/slurmd --systemd %(ENV_SLURMD_OPTIONS)s"
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
# Reconfigure hands off to a new daemon; the original process exits successfully.
# Restarting on that exit would launch a duplicate daemon.
autorestart=unexpected
exitcodes=0
