[program:sshd]
command=bash -xc "choom -n %(ENV_SLINKY_SSH_OOM_SCORE_ADJ)s -p $$ || echo '[sshd] WARNING: unable to restore the original OOM adjustment. Continuing with inherited score.' >&2 && exec /usr/sbin/sshd -D -e %(ENV_SSHD_OPTIONS)s"
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
